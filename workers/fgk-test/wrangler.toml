# TEST copy of the FGK wheel for the 2026 season. Not public.
name = "fgk-test"
main = "worker.js"
compatibility_date = "2026-08-31"

# Keep off the public internet: this copy serves the same member PIN data as production.
workers_dev = false
preview_urls = false

# Same database as production; this copy only reads and writes 2026 teams.
[[d1_databases]]
binding = "DB"
database_name = "playhq-warriors"
database_id = "d0e2a120-9971-4341-9960-9a6fa2d636be"

