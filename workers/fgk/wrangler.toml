# FGK (First Goal Kicker) wheel worker.
# Wheel is built on request from the fixture with status UPCOMING.
# Team sheets come from the admin sync in D1. No PlayHQ calls and no cron.

name = "fgk"
main = "worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "playhq-warriors"
database_id = "d0e2a120-9971-4341-9960-9a6fa2d636be"
