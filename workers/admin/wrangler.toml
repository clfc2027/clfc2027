# admin (PlayHQ sync Worker), code exactly as deployed on Cloudflare.
name = "admin"
main = "worker.js"
compatibility_date = "2026-08-31" # TODO: confirm in dashboard Settings

# Members reach this only through cockburnlakes.com (behind the club gate), never the workers.dev address.
workers_dev = false
preview_urls = false

# No cron triggers: the PlayHQ sync runs by hand only.

[[d1_databases]]
binding = "DB"
database_name = "playhq-warriors" # TODO: confirm in Settings > Bindings
database_id = "d0e2a120-9971-4341-9960-9a6fa2d636be"

# Game day duty allocations (the tally). Same FLEXI database the coaches board uses.
[[d1_databases]]
binding = "FLEXI"
database_name = "clfc2026-flexi"
database_id = "59096bce-7645-4f7b-a757-04290b67b063"

# Secrets (dashboard, not in this file): PLAYHQ_API_KEY, ADMIN_PASSCODE
# Variable (dashboard): PLAYHQ_ORG_ID
