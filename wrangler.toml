# Club hub (clfc2027): static pages from public/, served through worker.js.
name = "clfc2027"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Tool icons on the hub, served at /hub-icons/<file> by worker.js.
[[r2_buckets]]
binding = "HUB_ICONS"
bucket_name = "hub-icons"
