<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="description" content="Cockburn Lakes Football Club — 2027 grades." />
    <title>Cockburn Lakes F.C. — 2027 Grades</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Cockburn Lakes Football Club 2027 home">
          <img src="/assets/sml-clfc-logo.png" alt="Cockburn Lakes Football Club logo" />
          <span>
            <strong>COCKBURN LAKES</strong>
            <small>FOOTBALL CLUB · 2027</small>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/">The Hub</a>
          <a href="/grades" aria-current="page">Grades</a>
        </nav>
      </header>

      <main>
        <section class="section section-grades" aria-labelledby="grades-title">
          <div class="section-heading">
            <div>
              <p class="kicker">GRADES</p>
              <h2 id="grades-title">The 2027 <span>grades.</span></h2>
            </div>
          </div>
          <div class="grade-grid">
            <a class="grade-card" href="/league" data-grade="league">
              <span class="grade-index">01</span><img src="/assets/grade-logo_league-logo.png" alt="League grade 2027 badge" /><span class="grade-label">LEAGUE <small>B GRADE</small></span><span class="grade-arrow">↗</span>
            </a>
            <a class="grade-card" href="/reserves" data-grade="reserves">
              <span class="grade-index">02</span><img src="/assets/grade-logo_reserves-logo.png" alt="Reserves grade 2027 badge" /><span class="grade-label">RESERVES <small>B RESERVES</small></span><span class="grade-arrow">↗</span>
            </a>
            <a class="grade-card" href="/colts" data-grade="colts">
              <span class="grade-index">03</span><img src="/assets/grade-logo_colts-logo.png" alt="Colts grade 2027 badge" /><span class="grade-label">COLTS <small>PATHWAY GRADE</small></span><span class="grade-arrow">↗</span>
            </a>
            <a class="grade-card" href="/thirds" data-grade="thirds">
              <span class="grade-index">04</span><img src="/assets/grade-logo_thirds-logo.png" alt="Thirds grade 2027 badge" /><span class="grade-label">THIRDS <small>E2 SOUTH</small></span><span class="grade-arrow">↗</span>
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
