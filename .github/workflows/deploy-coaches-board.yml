name: Deploy coaches-board Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/coaches-board/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-coaches-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy coaches-board Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/coaches-board
          command: deploy
