name: Deploy club-gate Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/club-gate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-club-gate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy club-gate Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/club-gate
          command: deploy
