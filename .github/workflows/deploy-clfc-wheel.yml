name: Deploy clfc-wheel Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/clfc-wheel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-clfc-wheel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy clfc-wheel Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/clfc-wheel
          command: deploy
