name: Deploy weekly-fines Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/weekly-fines/**"
      - "shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-weekly-fines
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy weekly-fines Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/weekly-fines
          command: deploy
